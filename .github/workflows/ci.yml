name: verify-repo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          ruff check .github/scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Verify front matter, links, and changelog
        run: python .github/scripts/verify_repo.py
